{% extends "base.html" %}

{% block content %}
<form action="/action/img-convert" method="POST" enctype="multipart/form-data" style="text-align: right;">
    <div class="file-dropzone" onclick="document.getElementById('imgConvertFile').click()">
        <div style="font-size: 36px; margin-bottom: 10px;">🔄</div>
        <div style="font-weight: 700; font-size: 16px;">לחץ לבחירת תמונה להמרה</div>
        <div style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">תומך בכל סוגי התמונות הנפוצים</div>
        <input type="file" id="imgConvertFile" name="file" accept="image/*" style="display: none;" onchange="updateFileCount(this, 'fileCountConvert')">
        <div id="fileCountConvert" style="margin-top: 12px; font-weight: 700; color: var(--accent);"></div>
    </div>

    <label class="window-label" style="margin-top: 15px;">🎯 בחר פורמט יעד:</label>
    <select name="format" class="input-modern" style="background-color: #1e1b4b; border-radius: var(--radius-sm); color:#fff; height: 45px;">
        <option value="JPEG">JPEG (.jpg) - פורמט אידיאלי ושיתופי לתמונות</option>
        <option value="PNG">PNG (.png) - תמיכה ברקע שקוף ואיכות ללא אובדן</option>
        <option value="WEBP">WEBP (.webp) - דחיסה מודרנית ומהירה לאתרים</option>
        <option value="BMP">BMP (.bmp) - פורמט גרפי בסיסי</option>
    </select>

    <button type="submit" class="submit-btn">⚡ המר פורמט והורד</button>
</form>
{% endblock %}
