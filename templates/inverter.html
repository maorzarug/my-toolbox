{% extends "base.html" %}

{% block content %}
<div class="workspace-grid">
    <div class="editor-window">
        <div class="window-header">
            <span class="window-label">✍️ הטקסט המקורי שלך</span>
            <span id="srcCounter" class="char-counter">0 תווים | 0 מילים</span>
        </div>
        <textarea id="srcText" placeholder="הקלד או הדבק כאן את הטקסט..." oninput="processText()"></textarea>
    </div>
    <div class="editor-window">
        <div class="window-header">
            <span class="window-label">📋 התוצאה המעובדת</span>
            <button id="copyBtn" class="mini-copy-btn" onclick="copyResult('dstText', 'copyBtn')">📋 העתק הכל</button>
        </div>
        <textarea id="dstText" class="output-area" placeholder="התוצאה המעובדת תופיע כאן אוטומטית..." readonly></textarea>
    </div>
</div>

<div class="action-grid">
    <button id="btn-full" class="btn-action active" onclick="setMode('full')">🔄 היפוך מלא</button>
    <button id="btn-lines" class="btn-action" onclick="setMode('lines')">📝 בתוך שורות</button>
    <button id="btn-no_num" class="btn-action" onclick="setMode('no_num')">🔢 בלי מספרים</button>
    <button id="btn-no_eng" class="btn-action" onclick="setMode('no_eng')">🔤 בלי אנגלית</button>
    <button id="btn-eng2heb" class="btn-action" style="color: var(--accent-cyan); border-color: rgba(56, 189, 248, 0.3);" onclick="setMode('eng2heb')">⌨️ אנגלית ⬅️ עברית (ג'יבריש)</button>
    <button id="btn-heb2eng" class="btn-action" style="color: var(--danger); border-color: rgba(244, 63, 94, 0.3);" onclick="setMode('heb2eng')">⌨️ עברית ⬅️ אנגלית</button>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/inverter.js"></script>
<script>
// Live Counter for Inverter
const srcInput = document.getElementById('srcText');
if (srcInput) {
    srcInput.addEventListener('input', () => {
        const text = srcInput.value;
        const chars = text.length;
        const words = text.trim() ? text.trim().split(/\s+/).length : 0;
        document.getElementById('srcCounter').innerText = `${chars} תווים | ${words} מילים`;
    });
}
</script>
{% endblock %}
