{% extends "base.html" %}

{% block content %}
<form action="/action/pdf-merge" method="POST" enctype="multipart/form-data" style="text-align: right;" id="mergeForm">
    <div class="file-dropzone" onclick="document.getElementById('pdfMergeFiles').click()">
        <div class="dropzone-icon">📄</div>
        <div class="dropzone-title">לחץ או גרור לכאן קובצי PDF למיזוג</div>
        <div class="dropzone-sub">ניתן לבחור מספר קבצים בו-זמנית (הקבצים יאוחדו לפי הסדר)</div>
        <input type="file" id="pdfMergeFiles" name="files" accept=".pdf" multiple style="display: none;" onchange="updateFileCount(this, 'fileCountMerge')">
        <div id="fileCountMerge"></div>
    </div>
    
    <button type="submit" class="submit-btn" id="mergeSubmitBtn">
        📑 מזג את כל הקבצים למסמך אחד
    </button>
</form>
{% endblock %}

{% block scripts %}
<script>
const form = document.getElementById('mergeForm');
if (form) {
    form.addEventListener('submit', (e) => {
        const files = document.getElementById('pdfMergeFiles');
        if (!files || files.files.length === 0) {
            e.preventDefault();
            showToast('אנא בחר לפחות קובץ PDF אחד למיזוג', 'warning');
            return;
        }
        const btn = document.getElementById('mergeSubmitBtn');
        btn.innerHTML = '⏳ ממזג קבצים... אנא המתן';
        btn.disabled = true;
        setTimeout(() => {
            btn.innerHTML = '📑 מזג את כל הקבצים למסמך אחד';
            btn.disabled = false;
        }, 4000);
    });
}
</script>
{% endblock %}
