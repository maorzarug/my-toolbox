{% extends "base.html" %}

{% block content %}
<form action="/action/pdf-to-img" method="POST" enctype="multipart/form-data" style="text-align: right;" id="pdfToImgForm">
    <div class="file-dropzone" onclick="document.getElementById('pdfToImgFile').click()">
        <div class="dropzone-icon">🖼️</div>
        <div class="dropzone-title">לחץ או גרור לכאן קובץ PDF לפירוק לתמונות</div>
        <div class="dropzone-sub">כל דפי המסמך יחולצו כתמונות JPEG נפרדות בתוך ארכיון ZIP</div>
        <input type="file" id="pdfToImgFile" name="file" accept=".pdf" style="display: none;" onchange="updateFileCount(this, 'fileCountPdfImg')">
        <div id="fileCountPdfImg"></div>
    </div>
    
    <button type="submit" class="submit-btn" id="extractSubmitBtn">
        📦 חלץ דפים לתמונות והורד ZIP
    </button>
</form>
{% endblock %}

{% block scripts %}
<script>
const form = document.getElementById('pdfToImgForm');
if (form) {
    form.addEventListener('submit', (e) => {
        const file = document.getElementById('pdfToImgFile');
        if (!file || file.files.length === 0) {
            e.preventDefault();
            showToast('אנא בחר קובץ PDF לפירוק לתמונות', 'warning');
            return;
        }
        const btn = document.getElementById('extractSubmitBtn');
        btn.innerHTML = '⏳ מחלץ תמונות ומייצר ZIP... אנא המתן';
        btn.disabled = true;
        setTimeout(() => {
            btn.innerHTML = '📦 חלץ דפים לתמונות והורד ZIP';
            btn.disabled = false;
        }, 5000);
    });
}
</script>
{% endblock %}
