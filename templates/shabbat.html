<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שבת שלום ומבורך - ToolHub</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            background-color: #06080d;
            background-image: 
                radial-gradient(at 50% 20%, rgba(245, 158, 11, 0.12) 0px, transparent 60%),
                radial-gradient(at 50% 100%, rgba(99, 102, 241, 0.06) 0px, transparent 60%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .shabbat-card {
            max-width: 580px;
            width: 100%;
            background: rgba(18, 22, 34, 0.85);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 28px;
            padding: 48px 32px;
            text-align: center;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 40px rgba(245, 158, 11, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }

        .shabbat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #f59e0b, #fbbf24, transparent);
        }

        .candles-icon {
            font-size: 56px;
            margin-bottom: 16px;
            display: inline-block;
            filter: drop-shadow(0 0 20px rgba(245, 158, 11, 0.6));
            animation: flicker 3s ease-in-out infinite alternate;
        }

        @keyframes flicker {
            0% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(245, 158, 11, 0.5)); }
            50% { transform: scale(1.04); filter: drop-shadow(0 0 25px rgba(251, 191, 36, 0.8)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 18px rgba(245, 158, 11, 0.6)); }
        }

        .shabbat-title {
            font-size: 34px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 0%, #fbbf24 60%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .shabbat-desc {
            font-size: 16px;
            color: #cbd5e1;
            line-height: 1.7;
            margin-bottom: 24px;
        }

        .shabbat-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #fbbf24;
            font-size: 14px;
            font-weight: 700;
            border-radius: 9999px;
            margin-bottom: 20px;
        }

        .shabbat-footer {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="shabbat-card">
        <div class="candles-icon">🕯️🕯️</div>
        
        <div class="shabbat-badge">
            ✨ {{ event_title or 'שבת קודש' }}
        </div>

        <h1 class="shabbat-title">שבת שלום ומבורך!</h1>

        <p class="shabbat-desc">
            אתר <strong>ToolHub</strong> שומר שבת וסגור לפעילות בשבתות ובמועדי ישראל.<br>
            נשוב לפעילות מלאה מיד עם צאת השבת/החג בעזרת השם.
        </p>

        {% if havdalah_info %}
        <div style="background: rgba(0,0,0,0.3); padding: 12px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.06); font-size: 14px; color: #e2e8f0; display: inline-block;">
            ⏰ <strong>{{ havdalah_info }}</strong> (זמני ירושלים)
        </div>
        {% endif %}

        <div class="shabbat-footer">
            ToolHub Digital Toolkit • שומרים שבת כהלכתה
        </div>
    </div>

</body>
</html>
